<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Carousel page</title>
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Carousel  -->
     <div id="mycarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="./IMAGE/Iphone11pro_image.jpg" alt="Iphone11pro_image" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="./IMAGE/Iphone12pro_image.jpg" alt="Iphone12pro_image" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="./IMAGE/Iphone_image.jpg" alt="Iphoneimage" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="./IMAGE/Iphonepro_image.jpg" alt="Iphonepro_image" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="./IMAGE/Oppo_image.jpg" alt="Oppo_image" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="./IMAGE/Redmi_image.jpg" alt="Redmi_image" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="./IMAGE/Samsung_image.jpg" alt="Samsung_image" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="./IMAGE/Vivo_image.jpg" alt="Vivo_image" class="d-block w-100">
            </div>
        </div>

        <button class="carousel-control-prev text-dark" data-bs-target="#mycarousel" data-bs-slide="prev">previous</button>
        <button class="carousel-control-next text-dark" data-bs-target="#mycarousel" data-bs-slide="next">next</button>
     </div>
    



<!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

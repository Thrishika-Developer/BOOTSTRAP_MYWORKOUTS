<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title> Form task page</title>
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: rgb(207, 248, 250);
        }

        .image>img {
            border-radius: 20px;
            position: relative;
            top: -10px;
        }

        .one {
            margin-left: 190px;
            border-radius: 20px;
            box-shadow: 1px 1px 10px black;

            .upload {
                width: 70px;
            }
        }

        .two {
            margin-left: 180px;

            span {
                color: orange;
                text-decoration: underline;
                text-decoration-color: rgb(83, 106, 198);
            }
        }

        .file {
            margin-left: 1000px;
            margin-top: -75px;
            position: relative;
            top: -6px;

        }

        .num,
        .full,
        .email,
        .gender,
        .pin {
            margin-left: 500px;
            width: 500px;
            font-weight: 500;
            font-size: x-large;

            input {
                box-shadow: 1px 1px 10px black;
            }

            .male,
            .female {
                width: 246px;
                box-shadow: 1px 1px 10px black;
            }
        }

        .but {
            margin-left: 500px;
            width: 500px;
            background-color: rgb(46, 224, 126);
            border-radius: 10px;
            color: black;

        }

        .title {
            position: relative;
            top: -10px;
            margin-left: 240px;
            margin-top: -60px;
            color: orangered
        }

        button {
            border: none;
            border-radius: 10px;
        }

        .form-check {
            color: black;
        }

        .form-check-input:checked {
            background-color: rgb(115, 206, 226);
            border-color: black;
        }
    </style>
</head>

<body>
    <form class="needs-validation" novalidate>
        <div class="container one border border-dark mt-5 bg-white w-75">
            <!-- logo -->
            <div class="image">
                <img src="./logo.jpg" alt="logo" style="width:100px; height: 100px; padding: 20px;">
                <div class="title">
                    <h2 class="h2 title">edu GAMES</h2>
                </div>
                <!-- upload -->
                <div class="file">
                    <label for="fileupload">
                        <img src="./upload.jpg" alt="uploadicon" class="upload">
                    </label>
                    <input type="file" id="fileupload" hidden>
                </div>
            </div>
        </div>
        <!-- heading -->
        <div class="container two mt-3">
            <h1>Personalize your <span>Gaming</span><br>Experience</h1>
        </div>
        <!-- Phonenumber -->
        <div class="num">
            <label for="number" class="form-label">Phone Number</label>
            <input type="text" name="number" id="number" class="form-control  bg-white" required>
        </div>
        </div>
        <!-- Full name -->
        <div class="full mt-2">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" name="name" id="name" class="form-control  bg-white" required>
        </div>
        </div>
        <!-- Email -->
        <div class="email mt-2 needs-validation">
            <label for="email" class="form-label">Email</label>
            <input type="text" name="email" id="email" class="form-control   bg-white " required>
            <div class="invalid-feedback">Please enter username @ email format</div>
        </div>
        </div>
        <!-- Gender -->
        <div class="gender mt-2">
            <label class="form-label">Gender</label>
            <div class="d-flex">
                <div class="form-check me-5">
                    <input class="form-check-input" type="radio" name="gender" id="male" value="Male">
                    <label class="form-check-label" for="male">Male</label>
                </div>

                <div class="form-check ">
                    <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
                    <label class="form-check-label" for="female">Female</label>
                </div>
            </div>
        </div>


        <!-- Button -->
        <div class="d-grid mt-5 but">
            <button type="submit" class="text-center btn btn-success ">confirm Details</button>
        </div>
    </form>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (() => {
            'use strict'

            const forms = document.querySelectorAll('.needs-validation')

            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>

</html>

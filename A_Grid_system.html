<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid systems page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <!-- Basic grid structure -->
     <div class="container">
        <h3 class="h3 text-center bg-primary text-white">Basic grid structure</h3>
        <div class="row">
            <div class="col border border-primary">column</div>
        </div>
     </div>
     <br>
     <!-- Equal columns -->
      <div class="container">
        <h3 class="h3 text-center bg-primary text-white">Equal column</h3>
        <div class="row">
            <div class="col-6 border border-primary text-center">col-1</div>
            <div class="col-6 border border-primary text-center">col-2</div>
        </div>
      </div>
      <br>
       <!-- 4 & 8 -->
      <div class="container">
        <h3 class="h3 text-center bg-primary text-white">4 & 8 column</h3>
        <div class="row">
            <div class="col-4 border border-primary text-center">col-1</div>
            <div class="col-8 border border-primary text-center">col-2</div>
        </div>
      </div>
      <br>
       <!-- 8 & 4 columns -->
      <div class="container">
        <h3 class="h3 text-center bg-primary text-white">8 & 4 column</h3>
        <div class="row">
            <div class="col-8 border border-primary text-center">col-1</div>
            <div class="col-4 border border-primary text-center">col-2</div>
        </div>
      </div>
       <br>
       <!-- 12 columns -->
      <div class="container">
        <h3 class="h3 text-center bg-primary text-white">12 column</h3>
        <div class="row">
            
            <div class="col-1 border border-primary text-center">col-1</div>
            <div class="col-1 border border-primary text-center">col-2</div>
            <div class="col-1 border border-primary text-center">col-1</div>
            <div class="col-1 border border-primary text-center">col-2</div>
            <div class="col-1 border border-primary text-center">col-1</div>
            <div class="col-1 border border-primary text-center">col-2</div>
            <div class="col-1 border border-primary text-center">col-1</div>
            <div class="col-1 border border-primary text-center">col-2</div>
            <div class="col-1 border border-primary text-center">col-1</div>
            <div class="col-1 border border-primary text-center">col-2</div>
            <div class="col-1 border border-primary text-center">col-1</div>
            <div class="col-1 border border-primary text-center">col-2</div>
        </div>
      </div>
       <br>
       <!-- 7 & 5 columns -->
      <div class="container">
        <h3 class="h3 text-center bg-primary text-white">7 & 5 column</h3>
        <div class="row">
            <div class="col-7 border border-primary text-center">col-1</div>
            <div class="col-5 border border-primary text-center">col-2</div>
        </div>
      </div>
      <br>
      <!-- Auto columns --> <!--equal with automatically-->
     <div class="container">
        <h3 class="h3 text-center bg-primary text-white">Auto column</h3>
        <div class="row">
            <div class="col border border-primary text-center">col-1</div>
            <div class="col border border-primary text-center">col-2</div>
        </div>
      </div>
      <!-- Nested grid -->
       <div class="container">
        <h3 class="h3 text-center bg-primary text-white">Nested grid</h3>
        <div class="col-6">
            <div class="row">
            <div class="col-4 border border-primary text-center">col-1</div>
            <div class="col-4 border border-primary text-center">col-2</div>
            <div class="col-4 border border-primary text-center">col-3</div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height width page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <!-- Width -->
     <div class="container">
        <h3 class="h3 bg-primary bg-white">Width</h3>
        <div class="w-25 bg-primary text-white"> width</div><br>
        <div class="w-50 bg-primary text-white"> width</div><br>
        <div class="w-75 bg-primary text-white"> width</div><br>
        <div class="w-100 bg-primary text-white"> width</div><br>
        <div class="w-auto bg-primary text-white"> width</div>
     </div>

    <!-- Height -->
     <div class="container" style="height: 100px;">  <!--parent height to child splited-->
        <h3 class="h3 bg-primary bg-white">Width</h3>
        <div class="h-25 bg-primary text-white"> width</div><br>
        <div class="h-50 bg-primary text-white"> width</div><br>
        <div class="h-75 bg-primary text-white"> width</div><br>
        <div class="h-100 bg-primary text-white"> width</div><br>
        <div class="h-auto bg-primary text-white"> width</div>
     </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

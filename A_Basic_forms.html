<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Basic form page</title>
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Text input -->
     <h3 class="h3 container">Forms</h3>
     <div class="container">
        <label for="" class="form-label">Name</label>
        <input type="text" class="form-control" placeholder="Enter your name">
     </div>
     <!-- Password input -->
     <div class="container">
        <label for="" class="form-label">Password</label>
        <input type="password" class="form-control" placeholder="Enter your password">
    </div>
     <!-- Email input -->
     <div class="container">
        <label for="" class="form-label">Email</label>
        <input type="email" class="form-control" placeholder="Enter your email">
    </div>

     <!-- Email input -->
     <div class="container">
        <label for="" class="form-label">Age</label>
        <input type="number" class="form-control" placeholder="Enter your email">
    </div>
     <!-- File upload -->
     <div class="container">
        <label for="" class="form-label">File upload</label>
        <input type="file" class="form-control">
    </div>
    <br>
    <!-- Select dropdown -->
    <div class="container">
        <h6 class="h6">Select dropdown</h3>
        <label for="" class="form-label">choose course</label>
        <select class="form-selected">
            <option >select</option>
            <option >EEE</option>
            <option >ECE</option>
            <option >CSE</option>
        </select>
    </div>
    <!-- Checkbox -->
     <div class="container">
        <h6 class="h6">Select dropdown</h3>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="check">
            <label for="check" class="form-check-label">
                Accept terms
            </label>
        </div>
     </div>
     <!-- Ratio button -->
      <div class="container d-flex">
        <h6 class="h6 me-4">Ratio button</h3>
        <div class="form-check">
            <label for="male" class="form-check-label">Male</label>
            <input type="radio" class="form-check-input" name="gender" id="male">
        </div>
         <div class="form-check">
            <label for="female" class="form-check-label">Female</label>
            <input type="radio" class="form-check-input" name="gender" id="female">
        </div>
      </div>

      <!-- Text area -->
       <div class="container">
        <h6 class="h6">Text area</h3>
        <label for="text" class="form-label">
            <textarea name="text" id="text" placeholder="enter your message"></textarea>
        </label>
       </div>
       <br>
       <!-- button -->
        <div class="container">
        <button class="btn btn-primary">Submit</button>
        </div>









<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
